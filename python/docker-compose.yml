# Environnement de développement Docker (V2, OPP-071/072/073).
# - app : l'application Python. SQLite (OPP-072) est embarquée (volume dédié).
#
# LLM local (OPP-073) : on s'appuie sur l'Ollama **natif Windows** de la machine de
# dev (GPU, modèle déjà présent) plutôt que sur un conteneur Ollama. L'app le joint
# via `host.docker.internal`. Design conteneurisé (service `ollama`) conservé dans
# l'historique git — à réactiver le jour du packaging portable (cf. OPP-113).
services:
  app:
    build: .
    image: opportune-py:dev
    working_dir: /app
    # Résolution de `host.docker.internal` vers l'hôte (Ollama natif Windows/WSL2).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Chemin de la base SQLite dans le conteneur (persistée via le volume ci-dessous).
      - OPPORTUNE_DB_PATH=/app/data/opportune.db
      # Accès au LLM local : Ollama natif de l'hôte + modèle installé.
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=ministral-3:3b
    volumes:
      # Montage du code pour un cycle de dev rapide (l'install éditable pointe sur src/).
      - ./src:/app/src
      - ./tests:/app/tests
      # Persistance de la base SQLite entre les exécutions.
      - opportune-data:/app/data
    # Par défaut, lance les tests ; surchargeable : `docker compose run --rm app <cmd>`.
    command: pytest

volumes:
  opportune-data:
