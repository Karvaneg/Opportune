# Configuration du projet Python — cœur métier de la V2 d'Opportune.
# Métier + orchestrateur Hermes + API HTTP, écrits en bibliothèque standard
# (sqlite3, urllib, http.server) : aucune dépendance de production. Seul pytest
# est requis, et uniquement pour les tests (extra « dev »).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportune"
version = "1.0.0"
description = "Opportune — cœur métier V2 (Python) : métier, orchestrateur Hermes et API HTTP."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dépendances de développement (tests). Installées via : pip install -e ".[dev]".
dev = ["pytest>=8"]
# Récepteur live des clics Discord (gateway, option B, OPP-125). Confiné ici : le cœur
# métier reste sans dépendance et testable. Installé via : pip install -e ".[discord]".
discord = ["discord.py>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permet d'importer le package depuis src/ sans installation préalable.
pythonpath = ["src"]
