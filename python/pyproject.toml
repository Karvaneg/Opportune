# Configuration du projet Python — stack cible d'Opportune (V2, OPP-070).
# À ce stade : uniquement l'ossature (packaging, environnement, tests). Aucune
# dépendance métier (FastAPI, SQLAlchemy, Ollama…) ni logique portée — cela viendra
# avec OPP-071 (Docker/WSL), OPP-072 (SQLite), OPP-073 (Ollama) et la suite.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportune"
version = "0.1.0"
description = "Opportune — stack cible Python (V2). Ossature initiale."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dépendances de développement (tests). Installées via : pip install -e ".[dev]".
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permet d'importer le package depuis src/ sans installation préalable.
pythonpath = ["src"]
