name: CI

# Intégration continue — exécute les tests back et front à chaque PR vers main
# (et sur main après merge, pour que le badge du README reflète l'état de la branche).
# Strictement local-first : aucun déploiement, aucun service externe (pas d'Ollama).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs obsolètes : un nouveau push sur une PR (ou sur main) stoppe
# le run précédent de la même référence au lieu de les laisser se chevaucher.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # Le cœur métier n'a aucune dépendance de prod ; on installe les extras testés
      # (dev = pytest, pdf = pypdf, scrape = beautifulsoup4) pour que les tests qui en
      # dépendent s'exécutent vraiment au lieu d'être skippés.
      - name: Installer les dépendances
        run: pip install -e ".[dev,pdf,scrape]"
      - name: Lancer pytest
        run: pytest -q

  frontend:
    name: Front — vitest + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer vitest
        run: npm run test
      - name: Vérifier le typage (tsc)
        run: npx tsc --noEmit -p tsconfig.app.json

  e2e:
    # Parcours réels dans l'espace Démo (OPP-244) : front compilé servi par la vraie API, dans
    # Chromium. La démo est seedée sans LLM ni réseau, donc pas d'Ollama ici non plus.
    name: E2E — Playwright (démo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Installer l'API
        working-directory: python
        run: pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      # Navigateur en cache, clé = version de Playwright (package-lock) : pas de téléchargement
      # à chaque run. Les dépendances système, elles, ne sont pas en cache.
      - name: Lire la version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Installer Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Installer les dépendances système de Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Lancer les scénarios
        run: npm run test:e2e
        env:
          OPPORTUNE_E2E_PYTHON: python
      - name: Garder les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
